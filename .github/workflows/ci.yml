name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q nulltrace scan.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Module registry
        run: python scan.py --list

  data:
    name: validate reference data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON files parse
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("data").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("ok", path)
          PY
      - name: wordlists are non-empty
        run: |
          for f in data/*.txt; do test -s "$f" && echo "ok $f"; done
